name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php: '8.3'
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          ini-values: pcov.directory=src

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint (PHPStan)
        run: vendor/bin/phpstan analyse

      - name: Format check (PHP-CS-Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Test
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit --exclude-group smoke

      - name: Test with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --exclude-group smoke --coverage-clover coverage.xml
